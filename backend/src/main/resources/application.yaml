spring:
  application:
    name: backend

  docker:
    compose:
      file: ../docker-compose.yml
      lifecycle-management: start-only

  datasource:
    url: jdbc:postgresql://localhost:5432/yarumito
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${SERVER_PORT:8080}

app:
  jwt:
    secret: ${APP_JWT_SECRET:yarumito-dev-jwt-secret-key-32chars}
    expiration: 8h
    remember-expiration: 7d
  seed:
    email: ${APP_SEED_EMAIL:rector@yarumito.edu.co}
    password: ${APP_SEED_PASSWORD:Admin123!}
    demo: ${APP_SEED_DEMO:false}
    exit-after: ${APP_SEED_EXIT_AFTER:false}
